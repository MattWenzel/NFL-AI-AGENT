<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL AI Stats Agent</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --bg: #F8FAFC;
  --panel: #FFFFFF;
  --panel-strong: #FFFFFF;
  --panel-muted: #F1F5F9;
  --border: #CBD5E1;
  --border-subtle: #E2E8F0;
  --text: #0F172A;
  --muted: #64748B;
  --muted-strong: #334155;
  --accent: #4F46E5;
  --accent-strong: #4338CA;
  --accent-soft: #EEF2FF;
  --green: #059669;
  --green-soft: #D1FAE5;
  --amber: #B45309;
  --amber-soft: #FEF3C7;
  --red: #DC2626;
  --red-soft: #FEE2E2;
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 1px 1px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 4px 12px rgba(15, 23, 42, 0.08);
  --code-bg: #0F172A;
  --code-text: #E2E8F0;
}

:root[data-theme="dark"] {
  --bg: #0B1220;
  --panel: #0F172A;
  --panel-strong: #111827;
  --panel-muted: #1E293B;
  --border: #334155;
  --border-subtle: #1E293B;
  --text: #F1F5F9;
  --muted: #94A3B8;
  --muted-strong: #CBD5E1;
  --accent: #818CF8;
  --accent-strong: #A5B4FC;
  --accent-soft: #1E1B4B;
  --green: #34D399;
  --green-soft: #064E3B;
  --amber: #FBBF24;
  --amber-soft: #451A03;
  --red: #F87171;
  --red-soft: #450A0A;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 1px 1px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 4px 12px rgba(0, 0, 0, 0.35);
  --code-bg: #1E293B;
  --code-text: #F1F5F9;
}

* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
  color: var(--text);
  background: var(--bg);
}

.shell {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  height: 100vh;
  position: relative;
}

.sidebar,
.inspector {
  background: var(--panel);
  border-right: 1px solid var(--border);
}

.inspector {
  border-right: none;
  border-left: 1px solid var(--border);
}

.sidebar,
.main,
.inspector {
  min-height: 0;
  overflow: hidden;
}

.sidebar {
  display: flex;
  flex-direction: column;
}

.sidebar-header,
.inspector-header {
  padding: 20px;
  border-bottom: 1px solid var(--border);
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.brand-mark {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: var(--accent);
  color: #FFFFFF;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.86rem;
  font-weight: 700;
  letter-spacing: 0.02em;
}

.brand-title {
  font-size: 0.96rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.005em;
}

.nav-row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  border: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 0.9rem;
  font-weight: 500;
  padding: 9px 10px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s ease;
  text-align: left;
}

.nav-row:hover {
  background: var(--panel-muted);
}

.nav-row svg {
  flex-shrink: 0;
  color: var(--muted-strong);
}

.conversation-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sidebar-search {
  position: relative;
  padding: 0 12px 8px;
}

.sidebar-search input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 32px 8px 12px;
  font: inherit;
  font-size: 0.86rem;
  background: var(--panel-strong);
  color: var(--text);
  box-sizing: border-box;
}

.sidebar-search input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.sidebar-search-count {
  padding: 2px 4px 0;
  font-size: 0.72rem;
  color: var(--muted);
}

.conversation-group-label {
  padding: 10px 8px 4px;
  font-size: 0.68rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}

.conversation-item {
  padding: 12px;
  border-radius: 16px;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}

.conversation-item:hover {
  background: var(--panel-muted);
  border-color: var(--border);
}

.conversation-item.active {
  background: var(--accent-soft);
  border-color: var(--accent);
}

.conversation-top {
  display: flex;
  align-items: stretch;
  gap: 10px;
}

.conversation-title {
  flex: 1;
  min-width: 0;
  font-size: 0.92rem;
  font-weight: 600;
  line-height: 1.35;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  text-overflow: ellipsis;
  word-break: break-word;
}

.conversation-meta {
  margin-top: 6px;
  color: var(--muted);
  font-size: 0.78rem;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.conversation-actions {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 4px;
}

.conversation-action-row {
  display: flex;
  gap: 4px;
  align-items: center;
}

.conversation-actions .csv-icon {
  margin-top: auto;
}

.delete-btn,
.rename-btn,
.pin-btn {
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 1rem;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 6px;
  line-height: 1;
}

.delete-btn:hover,
.rename-btn:hover,
.pin-btn:hover {
  background: var(--panel-muted);
  color: var(--text);
}

.pin-btn.active {
  color: var(--accent);
}

.sidebar-tabs {
  display: flex;
  gap: 4px;
  padding: 8px 12px 0;
}

.sidebar-tab {
  flex: 1;
  background: transparent;
  border: 0;
  padding: 8px 10px;
  color: var(--muted);
  font: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.01em;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: color 0.15s ease, border-color 0.15s ease;
}

.sidebar-tab:hover {
  color: var(--text);
}

.sidebar-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.sidebar-pane {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
}

.sidebar-pane[hidden] {
  display: none;
}

.csv-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.csv-item {
  padding: 12px;
  border-radius: 16px;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.csv-item:hover {
  background: var(--panel-muted);
  border-color: var(--border);
}

.csv-item.active {
  background: var(--accent-soft);
  border-color: var(--accent);
}

.csv-empty {
  padding: 20px 12px;
  color: var(--muted);
  font-size: 0.85rem;
  text-align: center;
  line-height: 1.5;
}

.csv-icon {
  display: inline-flex;
  align-items: center;
  line-height: 1;
  font-size: 0.9rem;
  cursor: pointer;
  opacity: 0.8;
  transition: opacity 0.15s ease, transform 0.15s ease;
}

.csv-icon:hover {
  opacity: 1;
  transform: scale(1.1);
}

.csv-icon.stale {
  opacity: 0.4;
  cursor: default;
}

.csv-icon.stale:hover {
  opacity: 0.4;
  transform: none;
}

.thread-csv-banner {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid var(--accent);
  font-size: 0.82rem;
  font-weight: 500;
  margin: 0 0 16px;
  cursor: pointer;
  align-self: flex-start;
}

.thread-csv-banner:hover {
  filter: brightness(0.96);
}

.csv-viewer {
  padding: 28px 32px;
  overflow-y: auto;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 18px;
  box-sizing: border-box;
}

.csv-viewer-title {
  margin: 0;
  font-size: 1.3rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1.25;
}

.csv-viewer-meta {
  color: var(--muted);
  font-size: 0.82rem;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.csv-viewer-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 4px;
}

.button-primary,
.button-secondary {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 8px;
  font: inherit;
  font-size: 0.85rem;
  font-weight: 500;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
}

.button-primary {
  background: var(--accent);
  color: #FFFFFF;
  border: 1px solid var(--accent);
}

.button-primary:hover {
  filter: brightness(0.95);
}

.button-secondary {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}

.button-secondary:hover {
  background: var(--panel-muted);
  border-color: var(--muted);
}

.csv-viewer-sql {
  background: var(--panel-muted);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
}

.csv-viewer-sql summary {
  cursor: pointer;
  color: var(--muted-strong);
  font-size: 0.82rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  user-select: none;
}

.csv-viewer-sql pre {
  margin: 10px 0 0;
  padding: 0;
  background: transparent;
  font-size: 0.82rem;
  color: var(--text);
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}

.csv-viewer-table-wrap {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: auto;
  max-height: calc(100vh - 340px);
  background: var(--panel-strong);
}

.csv-viewer-table-wrap table {
  border-collapse: collapse;
  width: 100%;
  font-size: 0.82rem;
}

.csv-viewer-table-wrap th,
.csv-viewer-table-wrap td {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  white-space: nowrap;
}

.csv-viewer-table-wrap th {
  position: sticky;
  top: 0;
  background: var(--panel-muted);
  color: var(--muted-strong);
  font-weight: 600;
  font-size: 0.76rem;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  z-index: 1;
}

.csv-viewer-table-wrap tbody tr:hover {
  background: var(--panel-muted);
}

.csv-viewer-truncated {
  padding: 10px 14px;
  color: var(--muted);
  font-size: 0.8rem;
  text-align: center;
  border-top: 1px solid var(--border);
  background: var(--panel-muted);
}

.csv-viewer-missing {
  padding: 14px 16px;
  color: var(--muted);
  font-size: 0.85rem;
  text-align: center;
  border: 1px dashed var(--border);
  border-radius: 10px;
}

.main.viewing-csv .input-shell {
  display: none;
}

.rename-input {
  width: 100%;
  border: 1px solid var(--accent);
  border-radius: 6px;
  padding: 3px 6px;
  font: inherit;
  color: var(--text);
  background: var(--panel-strong);
  box-sizing: border-box;
}

.main {
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--panel-muted);
  color: var(--muted-strong);
  border: 1px solid var(--border);
  font-size: 0.78rem;
}

.theme-toggle {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--muted-strong);
  cursor: pointer;
  padding: 0;
  margin-left: auto;
  transition: background 0.15s ease, color 0.15s ease;
}

.theme-toggle:hover {
  background: var(--panel-muted);
  color: var(--text);
}

.theme-icon-sun { display: none; }
.theme-icon-moon { display: inline-block; }

:root[data-theme="dark"] .theme-icon-sun { display: inline-block; }
:root[data-theme="dark"] .theme-icon-moon { display: none; }

.composer-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
}

.composer-meta-left {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  min-width: 0;
}

.composer-select {
  appearance: none;
  -webkit-appearance: none;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 26px 5px 12px;
  font: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--muted-strong);
  background: var(--panel-strong);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 20 20' fill='none' stroke='%2364748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='5 8 10 13 15 8'/></svg>");
  background-repeat: no-repeat;
  background-position: right 9px center;
  background-size: 10px 10px;
  cursor: pointer;
  transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
}

.composer-select:hover {
  border-color: var(--accent);
  color: var(--text);
}

.composer-select:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.thread {
  flex: 1;
  overflow-y: auto;
  padding: 28px 24px 32px;
}

.thread-inner {
  max-width: 1080px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

.welcome {
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: 32px 0;
}

.welcome-card {
  max-width: 760px;
  width: 100%;
  background: var(--panel-strong);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--shadow-lg);
  padding: 32px;
}

.welcome-card h2 {
  margin: 0 0 10px;
  font-size: 2rem;
  line-height: 1.05;
}

.welcome-card p {
  margin: 0 0 24px;
  color: var(--muted);
  font-size: 1rem;
  line-height: 1.6;
}

.suggestions {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.suggestion {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel-strong);
  padding: 14px;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.suggestion:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
}

.suggestion strong {
  display: block;
  font-size: 0.96rem;
  margin-bottom: 5px;
}

.suggestion span {
  font-size: 0.82rem;
  color: var(--muted);
}

.turn-card {
  cursor: pointer;
  padding: 4px 0 12px;
  border-left: 3px solid transparent;
  padding-left: 14px;
  margin-left: -17px;
  transition: border-color 0.15s ease;
}

.turn-card.assistant.selected,
.turn-card.summary.selected {
  border-left-color: var(--accent);
}

.turn-card.user {
  display: flex;
  justify-content: flex-end;
  padding-left: 0;
  margin-left: 0;
  border-left: 0;
}

.turn-card.user > div {
  max-width: 72%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}

.turn-card.user .turn-bubble {
  background: var(--accent-soft);
  border-radius: 16px;
  padding: 10px 16px;
  color: var(--text);
  font-size: 0.96rem;
  line-height: 1.55;
  word-break: break-word;
}

.turn-card.user .turn-bubble > *:first-child { margin-top: 0; }
.turn-card.user .turn-bubble > *:last-child { margin-bottom: 0; }
.turn-card.user .turn-bubble p { margin: 0; }

.turn-card.user .turn-meta-user {
  margin-top: 4px;
  font-size: 0.72rem;
  color: var(--muted);
  opacity: 0;
  transition: opacity 0.15s ease;
  text-align: right;
}

.turn-card.user:hover .turn-meta-user {
  opacity: 1;
}

.turn-text {
  font-size: 0.96rem;
  line-height: 1.7;
}

.turn-text table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 0.83rem;
}

.turn-text th,
.turn-text td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  text-align: left;
  white-space: nowrap;
}

.turn-text pre {
  background: var(--code-bg);
  color: var(--code-text);
  padding: 14px;
  border-radius: 10px;
  overflow-x: auto;
}

.turn-text code {
  background: var(--panel-muted);
  padding: 2px 6px;
  border-radius: 6px;
}

.spinner {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  border: 2px solid currentColor;
  border-right-color: transparent;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.thinking {
  margin-bottom: 14px;
  border: 1px solid var(--border-subtle);
  border-radius: 10px;
  background: var(--panel-muted);
  overflow: hidden;
}

.thinking[open] { background: var(--panel); }

.thinking-summary {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
  font-size: 0.82rem;
  color: var(--muted-strong);
  list-style: none;
  user-select: none;
}

.thinking-summary::-webkit-details-marker { display: none; }

.thinking-chevron {
  display: inline-block;
  transition: transform 0.15s ease;
  color: var(--muted);
  font-size: 0.75rem;
}

.thinking[open] .thinking-chevron { transform: rotate(90deg); }

.thinking-label {
  font-weight: 600;
  color: var(--text);
}

.thinking-meta {
  margin-left: auto;
  color: var(--muted);
  font-size: 0.76rem;
}

.thinking-body {
  border-top: 1px solid var(--border-subtle);
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.thinking-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.1s ease;
}

.thinking-row:hover { background: var(--panel-muted); }

.thinking-status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--muted);
  margin-top: 6px;
  flex-shrink: 0;
}

.thinking-row.completed .thinking-status-dot { background: var(--green); }
.thinking-row.running .thinking-status-dot {
  background: var(--amber);
  animation: pulse 1.2s ease-in-out infinite;
}
.thinking-row.error .thinking-status-dot,
.thinking-row.failed .thinking-status-dot { background: var(--red); }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.thinking-tool {
  font-weight: 600;
  font-size: 0.82rem;
  color: var(--text);
  flex-shrink: 0;
}

.thinking-preview {
  font-family: "SFMono-Regular", Menlo, Consolas, monospace;
  font-size: 0.76rem;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}

.typing-dots {
  display: inline-flex;
  gap: 4px;
  padding: 6px 0;
}

.typing-dots span {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--muted);
  animation: blink 1.4s ease-in-out infinite;
}

.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes blink {
  0%, 80%, 100% { opacity: 0.2; transform: scale(0.9); }
  40% { opacity: 1; transform: scale(1); }
}

.copy-wrap {
  position: relative;
}

.copy-btn {
  position: absolute;
  top: 8px;
  right: 8px;
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--panel-strong);
  color: var(--muted-strong);
  font: inherit;
  font-size: 0.72rem;
  font-weight: 600;
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s ease, background 0.15s ease;
  z-index: 2;
}

.copy-wrap:hover .copy-btn,
.copy-btn.copied { opacity: 1; }

.copy-btn:hover { background: var(--panel-muted); }

.copy-btn.copied {
  background: var(--green-soft);
  color: var(--green);
  border-color: var(--green);
}

.copy-wrap pre .copy-btn {
  background: rgba(255, 255, 255, 0.1);
  color: #E2E8F0;
  border-color: rgba(255, 255, 255, 0.2);
}

.copy-wrap pre .copy-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.inline-status {
  margin-top: 12px;
  padding: 10px 12px;
  border-radius: 16px;
  background: var(--panel-muted);
  color: var(--muted-strong);
  font-size: 0.82rem;
  display: inline-flex;
  align-items: center;
  gap: 10px;
}

.summary-card {
  background: var(--amber-soft);
}

.input-shell {
  padding: 20px 24px 18px;
  background: var(--bg);
  position: relative;
}

/* Subtle fade above the composer so thread content softens into the
   input area when scrolled right up against it, instead of butting
   hard against the top of the composer. */
.input-shell::before {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: -16px;
  height: 16px;
  background: linear-gradient(to bottom, transparent, var(--bg));
  pointer-events: none;
}

.composer-row {
  max-width: 1080px;
  margin: 0 auto;
  position: relative;
}

.composer {
  min-width: 0;
  position: relative;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: var(--panel-strong);
  box-shadow: var(--shadow);
  padding: 12px 12px 10px;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.composer:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.composer textarea {
  width: 100%;
  border: 0;
  padding: 4px 6px;
  font: inherit;
  font-size: 0.96rem;
  line-height: 1.5;
  resize: none;
  min-height: 44px;
  max-height: 220px;
  background: transparent;
  color: var(--text);
  display: block;
  box-sizing: border-box;
}

.composer textarea:focus {
  outline: none;
}

.composer #sendBtn {
  width: 34px;
  height: 34px;
  border-radius: 8px;
  border: 0;
  background: var(--accent);
  color: #fff;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s ease;
  flex-shrink: 0;
}

.composer #sendBtn:hover:not(:disabled) {
  background: var(--accent-strong);
}

.composer #sendBtn:disabled { opacity: 0.45; cursor: not-allowed; }

.composer-hint {
  margin-top: 6px;
  font-size: 0.72rem;
  color: var(--muted);
  text-align: right;
}

.inspector {
  position: fixed;
  top: 0;
  right: 0;
  width: 380px;
  max-width: 90vw;
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: var(--panel);
  border-left: 1px solid var(--border);
  box-shadow: var(--shadow-lg);
  transform: translateX(100%);
  transition: transform 0.2s ease;
  z-index: 40;
}

.inspector.open {
  transform: translateX(0);
}

.inspector-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.25);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease;
  z-index: 30;
}

.inspector-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.inspector-collapse {
  position: absolute;
  top: 14px;
  right: 14px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 1.3rem;
  line-height: 1;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 8px;
}

.inspector-collapse:hover {
  background: var(--panel-muted);
  color: var(--text);
}

.inspector-toggle {
  position: fixed;
  top: 14px;
  right: 14px;
  border: 1px solid var(--border);
  background: var(--panel-strong);
  color: var(--muted-strong);
  font: inherit;
  font-size: 0.82rem;
  font-weight: 600;
  cursor: pointer;
  padding: 8px 14px;
  border-radius: 10px;
  box-shadow: var(--shadow);
  z-index: 20;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: background 0.15s ease, color 0.15s ease;
}

.inspector-toggle:hover {
  background: var(--panel-muted);
  color: var(--text);
}

.inspector-toggle.hidden { display: none; }

.inspector-header h3 {
  margin: 0;
  font-size: 1rem;
}

.inspector-header p {
  margin: 6px 0 0;
  color: var(--muted);
  font-size: 0.82rem;
  line-height: 1.5;
}

.inspector-body {
  flex: 1;
  overflow-y: auto;
  padding: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.panel-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel-strong);
  padding: 16px;
}

.panel-card h4 {
  margin: 0 0 10px;
  font-size: 0.88rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--muted);
}

.panel-card.panel-bare {
  border: 0;
  background: none;
  padding: 0;
  box-shadow: none;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.stat {
  padding: 10px;
  border-radius: 16px;
  background: var(--panel-muted);
}

.stat-label {
  color: var(--muted);
  font-size: 0.74rem;
  margin-bottom: 4px;
}

.stat-value {
  font-weight: 700;
  font-size: 0.92rem;
  font-variant-numeric: tabular-nums;
}

.detail-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.detail-item {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  background: var(--panel-strong);
}

.detail-top {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.detail-name {
  font-weight: 700;
  font-size: 0.86rem;
}

.detail-json,
.detail-text {
  margin-top: 8px;
  padding: 10px;
  border-radius: 14px;
  background: var(--panel-muted);
  font-family: "IBM Plex Mono", "SFMono-Regular", monospace;
  font-size: 0.74rem;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-word;
}

.detail-prose {
  margin-top: 8px;
  padding: 10px 12px;
  border-radius: 14px;
  background: var(--panel-muted);
  font-size: 0.84rem;
  line-height: 1.5;
  max-height: 360px;
  overflow-y: auto;
}

.detail-prose p:first-child { margin-top: 0; }
.detail-prose p:last-child { margin-bottom: 0; }
.detail-prose pre {
  background: var(--panel-muted);
  padding: 8px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 0.76rem;
}

.summary-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.summary-entry {
  border-radius: 10px;
  padding: 10px 12px;
  background: var(--amber-soft);
  border: 1px solid var(--amber-soft);
  font-size: 0.8rem;
}

.download-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 14px;
  background: var(--green);
  color: #fff;
  text-decoration: none;
  font-weight: 600;
}

@media (max-width: 1220px) {
  .shell {
    grid-template-columns: 260px minmax(0, 1fr);
  }
}

@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .sidebar {
    display: none;
  }
  .input-shell,
  .thread { padding-left: 16px; padding-right: 16px; }
  .suggestions { grid-template-columns: 1fr; }
  .inspector { width: 100vw; }
}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-brand">
        <span class="brand-mark">N</span>
        <span class="brand-title">NFL Stats</span>
        <button type="button" class="theme-toggle" id="themeToggle" title="Toggle theme" aria-label="Toggle theme">
          <svg class="theme-icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
          <svg class="theme-icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
      <button type="button" class="nav-row" id="newChatBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>New chat</span>
      </button>
    </div>
    <div class="sidebar-tabs" role="tablist">
      <button type="button" class="sidebar-tab active" id="tabChats" role="tab">Chats</button>
      <button type="button" class="sidebar-tab" id="tabCsvs" role="tab">CSVs</button>
    </div>
    <div class="sidebar-search">
      <input type="search" id="sidebarSearch" placeholder="Search conversations" autocomplete="off">
      <div class="sidebar-search-count" id="sidebarSearchCount"></div>
    </div>
    <div class="sidebar-pane" id="pane-chats">
      <div class="conversation-list" id="conversationList"></div>
    </div>
    <div class="sidebar-pane" id="pane-csvs" hidden>
      <div class="csv-list" id="csvList"></div>
    </div>
  </aside>

  <main class="main">
    <section class="thread" id="thread"></section>

    <footer class="input-shell">
      <div class="composer-row">
        <div class="composer">
          <textarea id="input" placeholder="Ask about NFL stats, exports, or a player comparison..." rows="1"></textarea>
          <div class="composer-meta">
            <div class="composer-meta-left">
              <select id="providerSelect" class="composer-select" aria-label="Provider"></select>
              <select id="modelSelect" class="composer-select" aria-label="Model"></select>
            </div>
            <button id="sendBtn" title="Send">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M2 21 23 12 2 3v7l15 2-15 2v7Z"/></svg>
            </button>
          </div>
        </div>
        <div class="composer-hint">Enter to send · Shift+Enter for a new line</div>
      </div>
    </footer>
  </main>

  <button class="inspector-toggle" id="inspectorToggle" title="Open inspector" aria-label="Open inspector">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
    Inspector
  </button>
  <div class="inspector-backdrop" id="inspectorBackdrop"></div>
  <aside class="inspector" id="inspector">
    <div class="inspector-header">
      <button class="inspector-collapse" id="inspectorCollapse" title="Close inspector" aria-label="Close inspector">&times;</button>
      <h3>Runtime Inspector</h3>
      <p>Inspect session metadata, selected turn details, tool lifecycle, and compaction history.</p>
    </div>
    <div class="inspector-body" id="inspectorBody"></div>
  </aside>
</div>

<script>
const API_BASE = "http://localhost:8001";

const state = {
  conversations: [],
  transcripts: new Map(),
  activeSessionId: localStorage.getItem("nfl_runtime_active_session") || null,
  selectedTurnId: null,
  liveTurn: null,
  isStreaming: false,
  providers: [],
  selectedProvider: localStorage.getItem("nfl_chat_provider") || "anthropic",
  selectedModel: localStorage.getItem("nfl_chat_model") || "",
  sidebarSearch: "",
  inspectorOpen: false,
  thinkingOpen: new Set(),
  sidebarView: localStorage.getItem("nfl_sidebar_view") || "chats",
  csvs: [],
  activeCsvId: localStorage.getItem("nfl_csv_active_id") || null,
  csvDetails: new Map(),
};

marked.setOptions({ breaks: true, gfm: true });

(function initTheme() {
  const stored = localStorage.getItem("nfl_theme");
  const initial = stored || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  document.documentElement.dataset.theme = initial;
})();

document.getElementById("themeToggle").addEventListener("click", () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("nfl_theme", next);
});

document.getElementById("newChatBtn").addEventListener("click", startNewSession);
function setInspectorOpen(open) {
  state.inspectorOpen = open;
  document.getElementById("inspector").classList.toggle("open", open);
  document.getElementById("inspectorBackdrop").classList.toggle("open", open);
  document.getElementById("inspectorToggle").classList.toggle("hidden", open);
}
document.getElementById("inspectorCollapse").addEventListener("click", () => setInspectorOpen(false));
document.getElementById("inspectorToggle").addEventListener("click", () => setInspectorOpen(true));
document.getElementById("inspectorBackdrop").addEventListener("click", () => setInspectorOpen(false));
document.getElementById("providerSelect").addEventListener("change", onProviderChange);
document.getElementById("modelSelect").addEventListener("change", onModelChange);
document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("input").addEventListener("keydown", handleInputKeydown);
document.getElementById("input").addEventListener("input", autoResize);
document.getElementById("sidebarSearch").addEventListener("input", (e) => {
  state.sidebarSearch = e.target.value;
  if (state.sidebarView === "csvs") renderCsvList();
  else renderConversationList();
});
document.getElementById("tabChats").addEventListener("click", () => setSidebarView("chats"));
document.getElementById("tabCsvs").addEventListener("click", () => setSidebarView("csvs"));

async function init() {
  await loadProviders();
  await Promise.all([refreshConversations(), refreshCsvs()]);
  if (state.activeSessionId && state.conversations.some(c => c.id === state.activeSessionId)) {
    await loadTranscript(state.activeSessionId);
  } else {
    state.activeSessionId = null;
  }
  if (state.activeCsvId && !state.csvs.some(c => c.id === state.activeCsvId)) {
    state.activeCsvId = null;
    localStorage.removeItem("nfl_csv_active_id");
  }
  applySidebarView();
  document.addEventListener("click", handleCopyClick);
  render();
}

async function handleCopyClick(event) {
  const btn = event.target.closest(".copy-btn");
  if (!btn) return;
  event.preventDefault();
  event.stopPropagation();
  const text = copyTextFromNode(btn);
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    btn.classList.add("copied");
    btn.textContent = "Copied!";
    setTimeout(() => {
      btn.classList.remove("copied");
      btn.textContent = "Copy";
    }, 1500);
  } catch (err) {
    console.error("Copy failed:", err);
  }
}

function handleInputKeydown(event) {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

function autoResize() {
  const input = document.getElementById("input");
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 220) + "px";
}

async function fetchJSON(path, init) {
  const resp = await fetch(`${API_BASE}${path}`, init);
  if (!resp.ok) {
    const text = await resp.text();
    throw new Error(text || `Request failed (${resp.status})`);
  }
  return resp.json();
}

async function loadProviders() {
  try {
    state.providers = await fetchJSON("/chat/providers");
  } catch {
    state.providers = [{
      name: "anthropic",
      display_name: "Anthropic",
      models: ["claude-sonnet-4-20250514"],
      default_model: "claude-sonnet-4-20250514",
      available: false,
      context_window: 200000,
      supports_streaming: true,
      supports_tools: true,
    }];
  }
  renderProviderControls();
}

function renderProviderControls() {
  const providerSelect = document.getElementById("providerSelect");
  providerSelect.innerHTML = "";
  const providers = [...state.providers].sort((a, b) => Number(b.available) - Number(a.available));
  for (const provider of providers) {
    const opt = document.createElement("option");
    opt.value = provider.name;
    opt.textContent = provider.display_name + (provider.available ? "" : " (no key)");
    opt.disabled = !provider.available;
    providerSelect.appendChild(opt);
  }
  const selected = providers.find(p => p.name === state.selectedProvider && p.available)
    || providers.find(p => p.available)
    || providers[0];
  if (selected) {
    state.selectedProvider = selected.name;
    providerSelect.value = selected.name;
  }
  const provider = state.providers.find(p => p.name === state.selectedProvider);
  const modelSelect = document.getElementById("modelSelect");
  modelSelect.innerHTML = "";
  if (!provider) return;
  for (const model of provider.models) {
    const opt = document.createElement("option");
    opt.value = model;
    opt.textContent = model;
    modelSelect.appendChild(opt);
  }
  state.selectedModel = provider.models.includes(state.selectedModel) ? state.selectedModel : provider.default_model;
  modelSelect.value = state.selectedModel;
}

function onProviderChange(event) {
  state.selectedProvider = event.target.value;
  state.selectedModel = "";
  localStorage.setItem("nfl_chat_provider", state.selectedProvider);
  localStorage.removeItem("nfl_chat_model");
  renderProviderControls();
  renderSessionHeader();
}

function onModelChange(event) {
  state.selectedModel = event.target.value;
  localStorage.setItem("nfl_chat_model", state.selectedModel);
  renderSessionHeader();
}

async function refreshConversations() {
  state.conversations = await fetchJSON("/chat/conversations");
  if (state.activeSessionId && !state.conversations.some(c => c.id === state.activeSessionId)) {
    state.activeSessionId = null;
    state.selectedTurnId = null;
  }
}

async function refreshCsvs() {
  try {
    state.csvs = await fetchJSON("/chat/exports");
  } catch (err) {
    console.error("Failed to load CSVs:", err);
    state.csvs = [];
  }
}

function applySidebarView() {
  const view = state.sidebarView === "csvs" ? "csvs" : "chats";
  document.getElementById("pane-chats").hidden = view !== "chats";
  document.getElementById("pane-csvs").hidden = view !== "csvs";
  document.getElementById("tabChats").classList.toggle("active", view === "chats");
  document.getElementById("tabCsvs").classList.toggle("active", view === "csvs");
  const search = document.getElementById("sidebarSearch");
  search.placeholder = view === "csvs" ? "Search CSVs" : "Search conversations";
}

function setSidebarView(view) {
  const next = view === "csvs" ? "csvs" : "chats";
  state.sidebarView = next;
  localStorage.setItem("nfl_sidebar_view", next);
  state.sidebarSearch = "";
  document.getElementById("sidebarSearch").value = "";
  applySidebarView();
  render();
}

async function loadTranscript(sessionId) {
  const transcript = await fetchJSON(`/chat/conversations/${sessionId}/transcript`);
  state.transcripts.set(sessionId, transcript);
  state.activeSessionId = sessionId;
  state.selectedTurnId = pickDefaultTurn(transcript);
  localStorage.setItem("nfl_runtime_active_session", sessionId);
  render();
}

function pickDefaultTurn(transcript) {
  const visibleTurns = transcript.turns.filter(turn => !turn.compacted || turn.role === "summary");
  const preferred = [...visibleTurns].reverse().find(turn => turn.role !== "user");
  return preferred ? preferred.id : (visibleTurns[0] ? visibleTurns[0].id : null);
}

function startNewSession() {
  state.activeSessionId = null;
  state.selectedTurnId = null;
  state.liveTurn = null;
  localStorage.removeItem("nfl_runtime_active_session");
  render();
}

async function deleteConversation(sessionId) {
  await fetchJSON(`/chat/conversations/${sessionId}`, { method: "DELETE" });
  state.transcripts.delete(sessionId);
  await refreshConversations();
  if (state.activeSessionId === sessionId) {
    startNewSession();
  }
  render();
}

async function renameConversation(sessionId, newTitle) {
  const updated = await fetchJSON(`/chat/conversations/${sessionId}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title: newTitle }),
  });
  const idx = state.conversations.findIndex((s) => s.id === sessionId);
  if (idx !== -1) state.conversations[idx] = updated;
  const transcript = state.transcripts.get(sessionId);
  if (transcript) transcript.title = updated.title;
  render();
}

async function togglePinned(sessionId, shouldPin) {
  const updated = await fetchJSON(`/chat/conversations/${sessionId}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ pinned: shouldPin }),
  });
  const idx = state.conversations.findIndex((s) => s.id === sessionId);
  if (idx !== -1) state.conversations[idx] = updated;
  // Re-sort so pinned bubble up to the top of state.conversations to match
  // the server order (pinned_at DESC, then updated_at DESC).
  state.conversations.sort((a, b) => {
    if (a.pinned_at && !b.pinned_at) return -1;
    if (!a.pinned_at && b.pinned_at) return 1;
    if (a.pinned_at && b.pinned_at) return b.pinned_at.localeCompare(a.pinned_at);
    return (b.updated_at || "").localeCompare(a.updated_at || "");
  });
  render();
}

async function sendMessage() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text || state.isStreaming) return;

  const previousTranscript = state.activeSessionId ? state.transcripts.get(state.activeSessionId) : null;
  state.isStreaming = true;
  state.liveTurn = {
    sessionId: state.activeSessionId,
    userText: text,
    assistantText: "",
    status: "starting",
    toolRuns: [],
    errors: [],
    compaction: null,
  };
  input.value = "";
  autoResize();
  render();

  try {
    const resp = await fetch(`${API_BASE}/chat/stream`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        conversation_id: state.activeSessionId || undefined,
        provider: state.selectedProvider || undefined,
        model: state.selectedModel || undefined,
      }),
    });
    if (!resp.ok) {
      throw new Error(await resp.text());
    }

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split("\n");
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data: ")) continue;
        const raw = line.slice(6).trim();
        if (!raw) continue;
        const event = JSON.parse(raw);
        handleStreamEvent(event, previousTranscript);
      }
    }
  } catch (error) {
    state.liveTurn.status = "error";
    state.liveTurn.errors.push(error.message);
    render();
  } finally {
    state.isStreaming = false;
    document.getElementById("sendBtn").disabled = false;
    document.getElementById("input").focus();
  }
}

function handleStreamEvent(event) {
  if (!state.liveTurn) return;
  if (event.type === "conversation_id") {
    state.liveTurn.sessionId = event.id;
    state.activeSessionId = event.id;
    localStorage.setItem("nfl_runtime_active_session", event.id);
  } else if (event.type === "assistant_started") {
    state.liveTurn.status = "responding";
  } else if (event.type === "text") {
    state.liveTurn.status = "responding";
    state.liveTurn.assistantText += event.text;
  } else if (event.type === "tool_call") {
    state.liveTurn.status = "tooling";
    state.liveTurn.toolRuns.push({
      id: event.tool_run_id,
      tool_name: event.name,
      input: event.input,
      status: "running",
      result: null,
      error: null,
    });
  } else if (event.type === "tool_result") {
    const tool = state.liveTurn.toolRuns.find(run => run.id === event.tool_run_id);
    if (tool) tool.status = "completed";
    state.liveTurn.status = "thinking";
  } else if (event.type === "tool_failed") {
    const tool = state.liveTurn.toolRuns.find(run => run.id === event.tool_run_id);
    if (tool) {
      tool.status = "error";
      tool.error = event.message;
    }
    state.liveTurn.errors.push(event.message);
  } else if (event.type === "compaction") {
    state.liveTurn.compaction = event.meta;
  } else if (event.type === "error") {
    state.liveTurn.status = "error";
    state.liveTurn.errors.push(event.message);
  } else if (event.type === "done") {
    finishLiveTurn();
    return;
  }
  render();
}

async function finishLiveTurn() {
  const sessionId = state.liveTurn ? state.liveTurn.sessionId : state.activeSessionId;
  state.isStreaming = false;
  if (sessionId) {
    await Promise.all([refreshConversations(), refreshCsvs()]);
    await loadTranscript(sessionId);
  }
  state.liveTurn = null;
  render();
}

function render() {
  if (state.sidebarView === "csvs") {
    renderCsvList();
  } else {
    renderConversationList();

  renderSessionHeader();

  item.innerHTML = `

function formatCsvCell(val) {
  // Trim IEEE-754 trailing noise in the preview only. The CSV file on disk
  // keeps its exact numeric values (the agent chose ROUND() or didn't), so
  // the download stays faithful; this just prevents the preview table from
  // surfacing "471.20000000000005" when the meaningful value is 471.2.
  if (val == null || val === "") return "";
  const str = String(val);
  if (/\.\d{5,}/.test(str)) {
    const num = Number(str);
    if (Number.isFinite(num)) {
      return parseFloat(num.toFixed(4)).toString();
    }
  }
  return str;
}

function formatFileSize(bytes) {
  if (!bytes && bytes !== 0) return "";
  if (bytes < 1024) return `${bytes} B`;
  if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
  return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
}

async function openCsv(csvId) {
  state.activeCsvId = csvId;
  localStorage.setItem("nfl_csv_active_id", csvId);
  if (!state.csvDetails.has(csvId)) {
    try {
      const detail = await fetchJSON(`/chat/exports/${csvId}`);
      state.csvDetails.set(csvId, detail);
    } catch (err) {
      console.error("Failed to load CSV detail:", err);
    }
  }
  render();
}

async function renameCsv(csvId, newTitle) {
  const updated = await fetchJSON(`/chat/exports/${csvId}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title: newTitle }),
  });
  const idx = state.csvs.findIndex(c => c.id === csvId);
  if (idx !== -1) state.csvs[idx] = updated;
  if (state.csvDetails.has(csvId)) {
    const detail = state.csvDetails.get(csvId);
    state.csvDetails.set(csvId, { ...detail, title: updated.title, updated_at: updated.updated_at });
  }
  render();
}

async function deleteCsv(csvId) {
  await fetchJSON(`/chat/exports/${csvId}`, { method: "DELETE" });
  state.csvs = state.csvs.filter(c => c.id !== csvId);
  state.csvDetails.delete(csvId);
  if (state.activeCsvId === csvId) {
    state.activeCsvId = null;
    localStorage.removeItem("nfl_csv_active_id");
  }
  render();
}

function beginCsvRename(item, csv) {
  const titleEl = item.querySelector(".conversation-title");
  if (!titleEl || titleEl.querySelector("input")) return;
  const currentTitle = csv.title || csv.filename || "Untitled";
  const input = document.createElement("input");
  input.type = "text";
  input.className = "rename-input";
  input.value = currentTitle;
  input.maxLength = 200;
  titleEl.innerHTML = "";
  titleEl.appendChild(input);
  input.focus();
  input.select();
  input.addEventListener("click", (e) => e.stopPropagation());

  let settled = false;
  const cancel = () => {
    if (settled) return;
    settled = true;
    titleEl.textContent = currentTitle;
  };
  const save = async () => {
    if (settled) return;
    const next = input.value.trim();
    if (!next || next === currentTitle) { cancel(); return; }
    settled = true;
    try {
      await renameCsv(csv.id, next);
    } catch (err) {
      console.error("Rename CSV failed:", err);
      titleEl.textContent = currentTitle;
    }
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); save(); }
    else if (e.key === "Escape") { e.preventDefault(); cancel(); }
  });
  input.addEventListener("blur", save);
}

function renderCsvViewer() {
  const thread = document.getElementById("thread");
  const detail = state.csvDetails.get(state.activeCsvId);
  const summary = state.csvs.find(c => c.id === state.activeCsvId);
  if (!detail) {
    thread.innerHTML = `<div class="csv-viewer"><div class="csv-viewer-missing">Loading CSV…</div></div>`;
    return;
  }
  const columns = detail.columns || [];
  const rows = detail.preview_rows || [];
  const title = detail.title || (summary && summary.title) || detail.filename;
  const headerCells = columns.map(col => `<th>${escapeHtml(col)}</th>`).join("");
  const bodyRows = rows.map(row => {
    const cells = columns.map(col => `<td>${escapeHtml(formatCsvCell(row[col]))}</td>`).join("");
    return `<tr>${cells}</tr>`;
  }).join("");
  const tableHtml = columns.length
    ? `<div class="csv-viewer-table-wrap">
         <table>
           <thead><tr>${headerCells}</tr></thead>
           <tbody>${bodyRows}</tbody>
         </table>
         ${detail.preview_truncated ? `<div class="csv-viewer-truncated">Preview limited to ${rows.length} rows. Download for full data.</div>` : ""}
       </div>`
    : `<div class="csv-viewer-missing">CSV file is missing on disk — the library row is still here for reference.</div>`;

  thread.innerHTML = `
    <div class="csv-viewer">
      <div class="csv-viewer-header">
        <h2 class="csv-viewer-title">${escapeHtml(title)}</h2>
        <div class="csv-viewer-meta">
          <span>${detail.row_count} rows</span>
          <span>${columns.length} columns</span>
          <span>${formatFileSize(detail.file_size)}</span>
          ${detail.created_at ? `<span>${escapeHtml(formatTime(detail.created_at))}</span>` : ""}
          <span class="mono">${escapeHtml(detail.filename)}</span>
        </div>
        <div class="csv-viewer-actions">
          <button type="button" class="button-primary" id="startChatWithCsv">Start chat about this CSV</button>
          <a class="button-secondary" href="${API_BASE}${detail.download_url}" download>Download</a>
        </div>
      </div>
      <details class="csv-viewer-sql"${state.thinkingOpen.has(`sql-${detail.id}`) ? " open" : ""}>
        <summary>Source SQL</summary>
        <pre><code>${escapeHtml(detail.sql || "")}</code></pre>
      </details>
      ${tableHtml}
    </div>`;
  const btn = document.getElementById("startChatWithCsv");
  if (btn) {
    btn.addEventListener("click", async () => {
      btn.disabled = true;
      try {
        await startChatFromCsv(detail.id);
      } catch (err) {
        console.error("Start chat from CSV failed:", err);
        btn.disabled = false;
      }
    });
  }
  const sqlDetails = thread.querySelector(".csv-viewer-sql");
  if (sqlDetails) {
    const key = `sql-${detail.id}`;
    sqlDetails.addEventListener("toggle", () => {
      if (sqlDetails.open) state.thinkingOpen.add(key);
      else state.thinkingOpen.delete(key);
    });
  }
}

async function startChatFromCsv(csvId) {

    model: state.selectedModel || null,
  };
  const resp = await fetchJSON(`/chat/exports/${csvId}/new-session`, {

function renderConversationList() {
  const list = document.getElementById("conversationList");
  const countEl = document.getElementById("sidebarSearchCount");
  list.innerHTML = "";

  const query = state.sidebarSearch.trim().toLowerCase();
  const filtered = query
    ? state.conversations.filter(s => (s.title || "").toLowerCase().includes(query))
    : state.conversations;

  if (countEl) {
    countEl.textContent = query
      ? `${filtered.length} of ${state.conversations.length}`
      : (state.conversations.length ? `${state.conversations.length} total` : "");
  }

  const pinned = filtered.filter(s => s.pinned_at);
  const unpinned = filtered.filter(s => !s.pinned_at);

  if (pinned.length) {
    const header = document.createElement("div");
    header.className = "conversation-group-label";
    header.textContent = "Pinned";
    list.appendChild(header);
    for (const session of pinned) {
      list.appendChild(buildConversationItem(session));
    }
  }

  const groups = groupSessionsByTime(unpinned);
  const labels = { today: "Today", yesterday: "Yesterday", thisWeek: "This Week", thisMonth: "This Month", older: "Older" };

  for (const key of ["today", "yesterday", "thisWeek", "thisMonth", "older"]) {
    const sessions = groups[key];
    if (!sessions.length) continue;
    const header = document.createElement("div");
    header.className = "conversation-group-label";
    header.textContent = labels[key];
    list.appendChild(header);
    for (const session of sessions) {
      list.appendChild(buildConversationItem(session));
    }
  }
}

function buildConversationItem(session) {
  const item = document.createElement("div");
  item.className = "conversation-item" + (session.id === state.activeSessionId ? " active" : "");
  const isPinned = Boolean(session.pinned_at);
  const pinIcon = isPinned ? "&#9733;" : "&#9734;";
  const pinTitle = isPinned ? "Unpin session" : "Pin session";
  // A conversation can be linked to a CSV two ways: it was opened from one
  // (source_csv_id) or it generated some (exports.source_session_id). Prefer
  // the seed CSV because that's the context the chat was built around; fall
  // back to the most recently generated CSV from this session. Either way,
  // one 📄 icon; click opens the most relevant target.
  const seedCsv = session.source_csv_id ? state.csvs.find(c => c.id === session.source_csv_id) : null;
  const generatedCsvs = state.csvs
    .filter(c => c.source_session_id === session.id)
    .sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
  const linkedCsv = seedCsv || generatedCsvs[0] || null;
  const csvLinkCount = (seedCsv ? 1 : 0) + generatedCsvs.length;
  const linkTitle = linkedCsv
    ? (csvLinkCount > 1
        ? `${csvLinkCount} linked CSVs — open: ${linkedCsv.title || linkedCsv.filename}`
        : `Open CSV: ${linkedCsv.title || linkedCsv.filename}`)
    : null;
  const csvIcon = linkedCsv
    ? `<span class="csv-icon" data-csv-id="${escapeHtml(linkedCsv.id)}" title="${escapeHtml(linkTitle)}">&#128196;</span>`
    : (session.source_csv_id
        ? `<span class="csv-icon stale" title="CSV no longer in library">&#128196;</span>`
        : "");
  item.innerHTML = `
    <div class="conversation-top">
      <div style="flex:1">
        <div class="conversation-title">${escapeHtml(session.title || "New session")}</div>
        <div class="conversation-meta">
          <span>${session.message_count} turns</span>
          ${session.provider ? `<span>${escapeHtml(session.provider)}</span>` : ""}
          ${session.updated_at ? `<span>${escapeHtml(formatTime(session.updated_at))}</span>` : ""}
        </div>
      </div>
      <div class="conversation-actions">
        <div class="conversation-action-row">
          <button class="pin-btn${isPinned ? " active" : ""}" title="${pinTitle}">${pinIcon}</button>
          <button class="rename-btn" title="Rename session">&#9998;</button>
          <button class="delete-btn" title="Delete session">&times;</button>
        </div>
        ${csvIcon}
      </div>
    </div>`;
  item.addEventListener("click", () => loadTranscript(session.id));
  item.querySelector(".delete-btn").addEventListener("click", async (e) => {
    e.stopPropagation();
    if (!window.confirm("Delete this conversation? This can't be undone.")) return;
    await deleteConversation(session.id);
  });
  item.querySelector(".rename-btn").addEventListener("click", (e) => {
    e.stopPropagation();
    beginRename(item, session);
  });
  item.querySelector(".pin-btn").addEventListener("click", async (e) => {
    e.stopPropagation();
    try {
      await togglePinned(session.id, !isPinned);
    } catch (err) {
      console.error("Pin toggle failed:", err);
    }
  });
  const icon = item.querySelector(".csv-icon:not(.stale)");
  if (icon) {
    icon.addEventListener("click", (e) => {
      e.stopPropagation();
      openCsv(icon.dataset.csvId);
      setSidebarView("csvs");
    });
  }
  return item;
}

function groupSessionsByTime(sessions) {
  const now = new Date();
  const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const yesterdayStart = todayStart - 86400000;
  const weekStart = todayStart - 6 * 86400000;
  const monthStart = todayStart - 29 * 86400000;
  const groups = { today: [], yesterday: [], thisWeek: [], thisMonth: [], older: [] };
  for (const session of sessions) {
    const ts = session.updated_at ? new Date(session.updated_at).getTime() : 0;
    if (ts >= todayStart) groups.today.push(session);
    else if (ts >= yesterdayStart) groups.yesterday.push(session);
    else if (ts >= weekStart) groups.thisWeek.push(session);
    else if (ts >= monthStart) groups.thisMonth.push(session);
    else groups.older.push(session);
  }
  return groups;
}

function beginRename(item, session) {
  const titleEl = item.querySelector(".conversation-title");
  if (!titleEl || titleEl.querySelector("input")) return;
  const currentTitle = session.title || "New session";
  const input = document.createElement("input");
  input.type = "text";
  input.className = "rename-input";
  input.value = currentTitle;
  input.maxLength = 200;
  titleEl.innerHTML = "";
  titleEl.appendChild(input);
  input.focus();
  input.select();
  input.addEventListener("click", (e) => e.stopPropagation());

  let settled = false;
  const cancel = () => {
    if (settled) return;
    settled = true;
    titleEl.textContent = currentTitle;
  };
  const save = async () => {
    if (settled) return;
    const next = input.value.trim();
    if (!next || next === currentTitle) { cancel(); return; }
    settled = true;
    try {
      await renameConversation(session.id, next);
    } catch (err) {
      console.error("Rename failed:", err);
      titleEl.textContent = currentTitle;
    }
  };
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); save(); }
    else if (e.key === "Escape") { e.preventDefault(); cancel(); }
  });
  input.addEventListener("blur", save);
}

function renderSessionHeader() {
  // No in-page header anymore; reflect the active session title in the browser tab
  // so multiple open tabs stay distinguishable.
  const transcript = state.activeSessionId ? state.transcripts.get(state.activeSessionId) : null;
  const sessionTitle = transcript?.title || state.liveTurn?.userText;
  document.title = sessionTitle ? `${sessionTitle} — NFL AI Stats Agent` : "NFL AI Stats Agent";
}

function renderThread() {
  const thread = document.getElementById("thread");
  // Preserve scroll across re-renders: stick to the bottom if the user was
  // already there (so streaming updates follow the latest text), otherwise
  // keep their current position (so clicking a chip or turn doesn't yank them).
  const wasNearBottom = thread.scrollHeight - thread.scrollTop - thread.clientHeight < 100;
  const savedScroll = thread.scrollTop;
  const transcript = state.activeSessionId ? state.transcripts.get(state.activeSessionId) : null;
  if (!transcript && !state.liveTurn) {
    thread.innerHTML = renderWelcome();
    for (const button of thread.querySelectorAll("[data-suggestion]")) {
      button.addEventListener("click", () => sendSuggestion(button.dataset.suggestion));
    }
    return;
  }

  let turns = transcript ? transcript.turns.filter(turn => !turn.compacted || turn.role === "summary") : [];
  // A CSV-seeded session has a synthetic summary turn at index 0 that
  // primes the LLM with the SQL/columns/row count. It's meant for the
  // model, not the reader — surface a chip instead. source_csv_id lives on
  // the conversation list entry (not the transcript response), so look it
  // up there.
  const activeConvo = transcript
    ? state.conversations.find(c => c.id === state.activeSessionId)
    : null;
  const sourceCsvId = activeConvo?.source_csv_id || null;
  const seededFromCsv = Boolean(sourceCsvId) && turns.length && turns[0].role === "summary";
  if (seededFromCsv) turns = turns.slice(1);
  const toolRunsByTurn = groupBy(transcript?.tool_runs || [], run => run.turn_id);
  const partsByTurn = groupBy(transcript?.parts || [], part => part.turn_id);

  // Collapse consecutive assistant turns (tool-loop iterations for one user
  // question) into a single card. Each iteration persists as its own turn in
  // the backend transcript, but the user experience reads better as one
  // assistant response with all tools listed beneath.
  const items = [];
  let pendingAssistant = null;
  const flushAssistant = () => {
    if (pendingAssistant) {
      items.push(renderAssistantGroupCard(pendingAssistant, toolRunsByTurn, partsByTurn));
      pendingAssistant = null;
    }
  };
  for (const turn of turns) {
    if (turn.role === "assistant") {
      if (pendingAssistant === null) pendingAssistant = [];
      pendingAssistant.push(turn);
    } else {
      flushAssistant();
      items.push(renderTurnCard(turn, toolRunsByTurn.get(turn.id) || [], partsByTurn.get(turn.id) || []));
    }
  }
  flushAssistant();

  if (state.liveTurn) {
    if (state.liveTurn.userText) items.push(renderLiveUserCard());
    items.push(renderLiveTurnCard());
  }

  let bannerHtml = "";
  if (sourceCsvId) {
    const csvInfo = state.csvs.find(c => c.id === sourceCsvId);
    if (csvInfo) {
      bannerHtml = `<div class="thread-csv-banner" data-csv-id="${escapeHtml(sourceCsvId)}" title="Open CSV viewer">&#128196; Based on: ${escapeHtml(csvInfo.title || csvInfo.filename)}</div>`;
    } else {
      bannerHtml = `<div class="thread-csv-banner stale" title="CSV no longer in library">&#128196; CSV deleted</div>`;
    }
  }
  thread.innerHTML = `<div class="thread-inner">${bannerHtml}${items.join("")}</div>`;
  const banner = thread.querySelector(".thread-csv-banner:not(.stale)");
  if (banner) {
    banner.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = banner.dataset.csvId;
      openCsv(id);
      setSidebarView("csvs");
    });
  }
  // stopPropagation on each node so a chip click selects the chip's
  // iteration, not the wrapping assistant card.
  for (const node of thread.querySelectorAll("[data-turn-id]")) {
    node.addEventListener("click", (e) => {
      e.stopPropagation();
      state.selectedTurnId = node.getAttribute("data-turn-id");
      // Auto-open inspector only when user explicitly clicks a tool run row
      // (they're asking to inspect the tool call). Plain turn clicks just
      // select without forcing the drawer open.
      if (node.classList.contains("thinking-row")) {
        setInspectorOpen(true);
      }
      renderInspector();
      renderThread();
    });
  }
  for (const summary of thread.querySelectorAll(".thinking-summary")) {
    summary.addEventListener("click", (e) => {
      e.stopPropagation();
    });
  }
  for (const details of thread.querySelectorAll(".thinking[data-thinking-key]")) {
    const key = details.getAttribute("data-thinking-key");
    details.addEventListener("toggle", () => {
      if (details.open) state.thinkingOpen.add(key);
      else state.thinkingOpen.delete(key);
    });
  }
  for (const button of thread.querySelectorAll("[data-suggestion]")) {
    button.addEventListener("click", () => sendSuggestion(button.dataset.suggestion));
  }
  for (const button of thread.querySelectorAll("[data-export-url]")) {
    button.addEventListener("click", async (e) => {
      e.preventDefault();
      await downloadCSV(button.dataset.exportUrl, button.dataset.exportFname);
    });
  }
  thread.scrollTop = wasNearBottom ? thread.scrollHeight : savedScroll;
}

function renderTurnCard(turn, toolRuns, parts) {
  const roleClass = turn.role === "summary" ? "summary" : turn.role;
  const selected = turn.id === state.selectedTurnId ? " selected" : "";

  if (roleClass === "user") {
    return `
      <article class="turn-card user${selected}" data-turn-id="${escapeHtml(turn.id)}">
        <div>
          <div class="turn-bubble">${renderMarkdown((turn.text || "").trim())}</div>
          <div class="turn-meta-user">${escapeHtml(formatTime(turn.updated_at))}</div>
        </div>
      </article>`;
  }

  const body = roleClass === "summary"
    ? `<div class="turn-text">${renderMarkdown(turn.text || "Compaction summary")}</div>`
    : turn.text
      ? `<div class="turn-text">${renderMarkdown(turn.text)}</div>`
      : `<div class="inline-status"><span class="spinner"></span>Waiting on tool activity</div>`;

  const thinkingHtml = renderThinkingBlock(toolRuns, { groupKey: turn.id });

  return `
    <article class="turn-card ${roleClass}${selected}" data-turn-id="${escapeHtml(turn.id)}">
      ${thinkingHtml}
      ${body}
      ${turn.error ? `<div class="inline-status" style="background:var(--red-soft);color:var(--red)">${escapeHtml(turn.error)}</div>` : ""}
      ${toolRuns.some(run => run.status === "running") ? `<div class="inline-status"><span class="spinner"></span>Tool execution persisted in transcript</div>` : ""}
    </article>`;
}

function renderAssistantGroupCard(iterations, toolRunsByTurn, partsByTurn) {
  // Fast path: a single iteration renders as a regular turn card.
  if (iterations.length === 1) {
    const t = iterations[0];
    return renderTurnCard(t, toolRunsByTurn.get(t.id) || [], partsByTurn.get(t.id) || []);
  }

  const last = iterations[iterations.length - 1];
  const selected = iterations.some(t => t.id === state.selectedTurnId) ? " selected" : "";

  // Concatenate non-empty iteration texts. Markdown paragraph breaks keep the
  // reading flow intact when the model emits commentary between tool calls.
  const combinedText = iterations
    .map(t => (t.text || "").trim())
    .filter(Boolean)
    .join("\n\n");

  // Collect tool runs across every iteration in chronological order. Each
  // chip carries its iteration's turn_id so clicking it selects that
  // iteration in the inspector.
  const allToolRuns = [];
  for (const it of iterations) {
    for (const run of toolRunsByTurn.get(it.id) || []) {
      allToolRuns.push(run);
    }
  }

  const totalInput = iterations.reduce((sum, t) => sum + (t.input_tokens || 0), 0);
  const totalOutput = iterations.reduce((sum, t) => sum + (t.output_tokens || 0), 0);
  const firstError = iterations.map(t => t.error).find(Boolean);

  const metaBits = [
    last.status,
    `${iterations.length} iterations`,
    totalOutput ? `${totalOutput} output tok` : "",
    totalInput ? `${totalInput} input tok` : "",
    formatTime(last.updated_at),
  ].filter(Boolean).join(" · ");

  const body = combinedText
    ? `<div class="turn-text">${renderMarkdown(combinedText)}</div>`
    : `<div class="inline-status"><span class="spinner"></span>Waiting on tool activity</div>`;

  const thinkingHtml = renderThinkingBlock(allToolRuns, { groupKey: last.id });

  return `
    <article class="turn-card assistant${selected}" data-turn-id="${escapeHtml(last.id)}">
      ${thinkingHtml}
      ${body}
      ${firstError ? `<div class="inline-status" style="background:var(--red-soft);color:var(--red)">${escapeHtml(firstError)}</div>` : ""}
      ${allToolRuns.some(run => run.status === "running") ? `<div class="inline-status"><span class="spinner"></span>Tool execution persisted in transcript</div>` : ""}
    </article>`;
}

function renderLiveUserCard() {
  const live = state.liveTurn;
  return `
    <article class="turn-card user">
      <div>
        <div class="turn-bubble">${renderMarkdown((live.userText || "").trim())}</div>
        <div class="turn-meta-user">sending…</div>
      </div>
    </article>`;
}

function renderLiveTurnCard() {
  const live = state.liveTurn;
  const selected = !state.selectedTurnId ? " selected" : "";
  const isTyping = !live.assistantText && live.status === "responding";
  const showTypingStatus = !live.assistantText && !isTyping;
  return `
    <article class="turn-card assistant${selected}">
      ${renderThinkingBlock(live.toolRuns, { forceOpen: true })}
      <div class="turn-text">${live.assistantText ? renderMarkdown(live.assistantText) : ""}</div>
      ${isTyping ? `<div class="typing-dots"><span></span><span></span><span></span></div>` : ""}
      ${showTypingStatus ? `<div class="inline-status"><span class="spinner"></span>${escapeHtml(statusLabel(live.status))}</div>` : ""}
      ${live.compaction ? `<div class="inline-status">Compaction triggered before this turn (${live.compaction.active_tokens_before} active tokens / ${live.compaction.context_window} budget)</div>` : ""}
      ${live.errors.map(error => `<div class="inline-status" style="background:var(--red-soft);color:var(--red)">${escapeHtml(error)}</div>`).join("")}
    </article>`;
}

function renderInspector() {
  const root = document.getElementById("inspectorBody");
  const transcript = state.activeSessionId ? state.transcripts.get(state.activeSessionId) : null;
  const live = state.liveTurn;
  const selectedTurn = transcript?.turns.find(turn => turn.id === state.selectedTurnId) || null;
  const selectedToolRuns = selectedTurn ? transcript.tool_runs.filter(run => run.turn_id === selectedTurn.id) : [];

  const cards = [];
  if (transcript) {
    const compactedTurns = transcript.turns.filter(turn => turn.compacted).length;
    cards.push(`
      <section class="panel-card">
        <h4>Session</h4>
        <div class="stats-grid">
          <div class="stat"><div class="stat-label">Title</div><div class="stat-value">${escapeHtml(transcript.title || "Untitled")}</div></div>
          <div class="stat"><div class="stat-label">Turns</div><div class="stat-value">${transcript.turns.length}</div></div>
          <div class="stat"><div class="stat-label">Provider</div><div class="stat-value">${escapeHtml(transcript.provider || "n/a")}</div></div>
          <div class="stat"><div class="stat-label">Compacted</div><div class="stat-value">${compactedTurns}</div></div>
        </div>
      </section>`);
  }

  if (selectedTurn) {
    const tokenStats = selectedTurn.role === "assistant"
      ? `<div class="stat"><div class="stat-label">Input tok</div><div class="stat-value">${selectedTurn.input_tokens || 0}</div></div>
         <div class="stat"><div class="stat-label">Output tok</div><div class="stat-value">${selectedTurn.output_tokens || 0}</div></div>`
      : "";
    const toolCount = selectedToolRuns.length;
    const toolStat = selectedTurn.role === "assistant"
      ? `<div class="stat"><div class="stat-label">Tool runs</div><div class="stat-value">${toolCount}</div></div>`
      : "";
    cards.push(`
      <section class="panel-card">
        <h4>Selected Turn</h4>
        <div class="stats-grid">
          <div class="stat"><div class="stat-label">Role</div><div class="stat-value">${escapeHtml(selectedTurn.role)}</div></div>
          <div class="stat"><div class="stat-label">Status</div><div class="stat-value">${escapeHtml(selectedTurn.status)}</div></div>
          ${tokenStats}
          ${toolStat}
          <div class="stat"><div class="stat-label">Updated</div><div class="stat-value">${escapeHtml(formatTime(selectedTurn.updated_at))}</div></div>
        </div>
        ${selectedTurn.error ? `<div class="inline-status" style="background:var(--red-soft);color:var(--red);margin-top:8px">${escapeHtml(selectedTurn.error)}</div>` : ""}
      </section>`);
  }

  if (selectedToolRuns.length || (live && live.toolRuns.length)) {
    const runs = selectedToolRuns.length ? selectedToolRuns : live.toolRuns;
    cards.push(`
      <section class="panel-card panel-bare">
        <h4>Tool Runs</h4>
        <div class="detail-list">
          ${runs.map(run => `
            <div class="detail-item">
              <div class="detail-top">
                <div class="detail-name">${escapeHtml(run.tool_name)}</div>
                <div class="pill">${escapeHtml(run.status)}</div>
              </div>
              <div class="detail-json">${escapeHtml(JSON.stringify(run.input || run.input_json || {}, null, 2))}</div>
              ${run.result ? `<div class="detail-text">${escapeHtml(run.result)}</div>` : ""}
              ${run.error ? `<div class="detail-text" style="background:var(--red-soft);color:var(--red)">${escapeHtml(run.error)}</div>` : ""}
            </div>
          `).join("")}
        </div>
      </section>`);
  }

  if (transcript?.summaries?.length) {
    cards.push(`
      <section class="panel-card">
        <h4>Compaction</h4>
        <div class="summary-list">
          ${transcript.summaries.map(summary => `
            <div class="summary-entry">
              <strong>${escapeHtml(summary.summary_turn_id)}</strong><br>
              ${summary.source_turn_ids.length} source turns compacted · ${escapeHtml(formatTime(summary.created_at))}
            </div>
          `).join("")}
        </div>
      </section>`);
  }

  if (live?.compaction) {
    cards.push(`
      <section class="panel-card">
        <h4>Live Compaction</h4>
        <div class="detail-text">${escapeHtml(JSON.stringify(live.compaction, null, 2))}</div>
      </section>`);
  }

  if (!cards.length) {
    cards.push(`
      <section class="panel-card">
        <h4>Inspector</h4>
        <div class="detail-text">Select a session or a turn to inspect its transcript, tool runs, and compaction details.</div>
      </section>`);
  }
  root.innerHTML = cards.join("");
}

function renderThinkingBlock(toolRuns, { forceOpen = false, groupKey = "" } = {}) {
  if (!toolRuns.length) return "";
  const running = toolRuns.some(r => r.status === "running");
  const open = forceOpen || running || state.thinkingOpen.has(groupKey);
  const total = toolRuns.length;
  const totalDuration = toolRuns.reduce((sum, r) => sum + (r.duration_ms || 0), 0);
  const summaryBits = [`${total} tool call${total === 1 ? "" : "s"}`];
  if (totalDuration) summaryBits.push(`${totalDuration}ms`);

  const rows = toolRuns.map(run => {
    const preview = extractToolPreview(run);
    const turnAttr = run.turn_id ? ` data-turn-id="${escapeHtml(run.turn_id)}"` : "";
    return `
      <div class="thinking-row ${escapeHtml(run.status)}"${turnAttr}>
        <span class="thinking-status-dot"></span>
        <span class="thinking-tool">${escapeHtml(run.tool_name)}</span>
        <span class="thinking-preview">${escapeHtml(preview)}</span>
      </div>`;
  }).join("");

  const groupAttr = groupKey ? ` data-thinking-key="${escapeHtml(groupKey)}"` : "";
  return `
    <details class="thinking"${open ? " open" : ""}${groupAttr}>
      <summary class="thinking-summary">
        <span class="thinking-chevron">▸</span>
        <span class="thinking-label">Thinking</span>
        <span class="thinking-meta">${escapeHtml(summaryBits.join(" · "))}</span>
      </summary>
      <div class="thinking-body">${rows}</div>
    </details>`;
}

function extractToolPreview(run) {
  const input = run.input;
  if (!input) return "";
  if (typeof input === "string") return input.slice(0, 160);
  if (input.sql) return String(input.sql).replace(/\s+/g, " ").slice(0, 160);
  if (input.name) return `name="${input.name}"`;
  if (input.table_name) return `table=${input.table_name}`;
  if (input.gsis_id) return `gsis_id=${input.gsis_id}`;
  try { return JSON.stringify(input).slice(0, 160); } catch { return ""; }
}

function renderWelcome() {
  return `
    <div class="welcome">
      <div class="welcome-card">
        <h2>Ask deeper NFL questions without losing the thread.</h2>
        <p>The backend now stores a real transcript with tool runs and compaction summaries. This UI is built around that runtime: conversations load from the server, long sessions stay inspectable, and you can see how the agent got its answer when you need to.</p>
        <div class="suggestions">
          ${[
            ["Who led the NFL in passing yards in 2024?", "Season leaderboard"],
            ["Compare Derrick Henry and Saquon Barkley rushing stats in 2024", "Side-by-side player view"],
            ["Create a CSV of top 25 PPR scorers from 2024", "Export and download flow"],
            ["What were the biggest playoff upsets in 2024?", "Games, spreads, and results"],
          ].map(([label, desc]) => `
            <button class="suggestion" data-suggestion="${escapeHtml(label)}">
              <strong>${escapeHtml(label)}</strong>
              <span>${escapeHtml(desc)}</span>
            </button>`).join("")}
        </div>
      </div>
    </div>`;
}

function fillSuggestion(text) {
  const input = document.getElementById("input");
  input.value = text;
  autoResize();
  input.focus();
}

function sendSuggestion(text) {
  fillSuggestion(text);
  sendMessage();
}

function preview(text, maxChars) {
  return text.length > maxChars ? text.slice(0, maxChars) + "..." : text;
}

function statusLabel(status) {
  if (status === "tooling") return "Running tools...";
  if (status === "thinking") return "Synthesizing answer...";
  if (status === "error") return "Turn ended with an error.";
  return "Starting response...";
}

function escapeHtml(value) {
  const div = document.createElement("div");
  div.textContent = value == null ? "" : String(value);
  return div.innerHTML;
}

function renderMarkdown(text) {
  let html = marked.parse(text || "");
  html = html.replace(
    /<table>([\s\S]*?)<\/table>/g,
    (_, inner) => `<div class="copy-wrap" data-copy-kind="table"><button type="button" class="copy-btn" data-copy-action="table">Copy</button><div style="overflow-x:auto"><table>${inner}</table></div></div>`
  );
  html = html.replace(
    /<pre>([\s\S]*?)<\/pre>/g,
    (_, inner) => `<div class="copy-wrap"><button type="button" class="copy-btn" data-copy-action="pre">Copy</button><pre>${inner}</pre></div>`
  );
  html = html.replace(
    /<a href="(\/exports\/[^"]+)"[^>]*>([\s\S]*?)<\/a>/g,
    (match, path, label) => `<a class="download-btn" href="#" data-export-url="${API_BASE + path}" data-export-fname="${path.split("/").pop()}">${label}</a>`
  );
  return html;
}

function copyTextFromNode(btn) {
  const wrap = btn.closest(".copy-wrap");
  if (!wrap) return "";
  const kind = btn.dataset.copyAction;
  if (kind === "pre") {
    const code = wrap.querySelector("pre");
    return code ? code.textContent : "";
  }
  if (kind === "table") {
    const table = wrap.querySelector("table");
    if (!table) return "";
    return Array.from(table.rows)
      .map(row => Array.from(row.cells).map(c => c.textContent.trim()).join("\t"))
      .join("\n");
  }
  return "";
}

function groupBy(items, keyFn) {
  const map = new Map();
  for (const item of items) {
    const key = keyFn(item);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(item);
  }
  return map;
}

function formatTime(value) {
  if (!value) return "";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return value;
  return date.toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
}

async function downloadCSV(url, filename) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`Download failed (${resp.status})`);
  const blob = await resp.blob();
  const objectUrl = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = objectUrl;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(objectUrl);
}

window.fillSuggestion = fillSuggestion;
window.sendSuggestion = sendSuggestion;

init().catch((error) => {
  document.getElementById("thread").innerHTML = `<div class="thread-inner"><div class="turn-card"><div class="turn-text">Failed to initialize UI: ${escapeHtml(error.message)}</div></div></div>`;
});
</script>
